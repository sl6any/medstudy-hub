<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MedStudy Hub</title>
  <meta name="description" content="Lightweight study hub for Pedia, OBGYN, Surgery, and Medicine.">
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <img src="assets/favicon.svg" alt="" class="logo" />
      <h1>MedStudy Hub</h1>
    </div>
    <nav class="top-nav">
      <button id="toggleTheme" class="btn ghost" aria-label="Toggle theme">🌗</button>
      <a class="btn" href="#/">Home</a>
      <a class="btn" href="#/topic/obgyn">OBGYN</a>
      <a class="btn disabled" href="#/topic/pedia" title="Coming soon">Pedia</a>
      <a class="btn disabled" href="#/topic/surgery" title="Coming soon">Surgery</a>
      <a class="btn disabled" href="#/topic/medicine" title="Coming soon">Medicine</a>
    </nav>
  </header>

  <main id="app"></main>

  <footer class="site-footer">
    <p>© <span id="year"></span> MedStudy Hub • Built for quick revision. <a href="README.md">README</a></p>
  </footer>

  <!-- All JS inline so Safari can’t skip it -->
  <script>
  // helpers
  const el = s => document.querySelector(s);
  const app = el('#app');

  // theme
  const state = {
    theme: localStorage.getItem('theme') || 'dark',
    tab: 'quiz',
    questions: [],
    current: 0,
    score: 0,
    answered: false,
    selectedIndex: null,
    filter: ''
  };
  function applyTheme(){
    if (state.theme === 'light') document.body.classList.add('light');
    else document.body.classList.remove('light');
  }
  applyTheme();
  const themeBtn = el('#toggleTheme');
  if (themeBtn) themeBtn.addEventListener('click', () => {
    state.theme = state.theme === 'light' ? 'dark' : 'light';
    localStorage.setItem('theme', state.theme);
    applyTheme();
  });

  // small OBGYN dataset embedded (so no fetch needed)
  const OBGYN_QUESTIONS = [
    {id:1,question:"28-year-old at 5 weeks with bleeding + open os; most likely cause?",options:["Luteal phase defect","Asherman's","Cervical incompetence","Chromosomal abnormality"],answer:3,explanation:"Early loss most often due to chromosomal abnormalities."},
    {id:2,question:"CTG with recurrent late decelerations suggests…",options:["Placenta previa","Head compression","Cord compression","Uteroplacental insufficiency"],answer:3,explanation:"Late decels = uteroplacental insufficiency."},
    {id:3,question:"Sudden severe unilateral pelvic pain, adnexal fullness, not pregnant →",options:["Cystitis","Ovarian torsion","Appendicitis","Ectopic"],answer:1,explanation:"Classic for torsion."},
    {id:4,question:"Major risk for ectopic pregnancy?",options:["Ovulation induction","Previous ectopic","PID","IUD use"],answer:2,explanation:"PID damages tubes."},
    {id:5,question:"Late-pregnancy dizziness in bed best managed by…",options:["Transfusion","Neurology referral","Avoid supine position","ECG/Echo"],answer:2,explanation:"Supine hypotension → left lateral."},
    {id:6,question:"Advantage of mediolateral episiotomy?",options:["Easy repair","Less infection","Tighter introitus","Less anal extension"],answer:3,explanation:"Lower risk of OASIS."},
    {id:7,question:"Dizygotic twins are…",options:["Mono/mono","Mono/di","Di/mono","Di/di"],answer:3,explanation:"Always dichorionic–diamniotic."},
    {id:8,question:"Postcoital bleeding most commonly from…",options:["Cervix","Uterine body","Vagina","Vulva"],answer:0,explanation:"Cervical origin common."},
    {id:9,question:"Best screening step for ↓ fetal movement at 34w?",options:["NST","BPP","Pelvic exam","Vibroacoustic"],answer:0,explanation:"Start with NST."},
    {id:10,question:"First-line for primary dysmenorrhea?",options:["NSAIDs","COCP","Dilatation","Danazol"],answer:0,explanation:"NSAIDs first."}
  ];

  // router
  function route(){
    const h = location.hash || '#/';
    if (h === '#/' || h === '#') return renderHome();
    if (h.startsWith('#/topic/obgyn')) return renderObgyn();
    renderNotFound();
  }
  window.addEventListener('hashchange', route);

  // views
  function renderHome(){
    app.innerHTML = `
      <section class="hero">
        <div class="panel">
          <h2>Pick your topic</h2>
          <p>Your lightweight study space for <strong>Pedia</strong>, <strong>OBGYN</strong>, <strong>Surgery</strong>, and <strong>Medicine</strong>.</p>
          <div class="grid" style="margin-top:12px">
            <a class="card" href="#/topic/obgyn" aria-label="OBGYN">
              <h3>OBGYN</h3>
              <p>MCQs + quiz mode powered by embedded data.</p>
              <span class="badge">Ready</span>
            </a>
            <div class="card"><h3>Pedia</h3><p>Coming soon.</p><span class="badge">Todo</span></div>
            <div class="card"><h3>Surgery</h3><p>Coming soon.</p><span class="badge">Todo</span></div>
            <div class="card"><h3>Medicine</h3><p>Coming soon.</p><span class="badge">Todo</span></div>
          </div>
        </div>
        <div class="panel">
          <h2>How it works</h2>
          <ol>
            <li>Click <span class="kbd">OBGYN</span> to start.</li>
            <li>Choose <strong>Quiz</strong> or <strong>Browse</strong> tab.</li>
            <li>Score updates instantly.</li>
          </ol>
        </div>
      </section>
    `;
  }

  function renderObgyn(){
    if (!state.questions.length) {
      state.questions = OBGYN_QUESTIONS.slice();
      state.current = 0; state.score = 0; state.answered = false; state.selectedIndex = null; state.filter='';
    }
    const q = state.questions[state.current];
    app.innerHTML = `
      <section class="card">
        <div class="toolbar">
          <div class="tabbar" role="tablist">
            <button class="${state.tab==='quiz'?'active':''}" id="tab-quiz">Quiz</button>
            <button class="${state.tab==='browse'?'active':''}" id="tab-browse">Browse</button>
          </div>
          <div style="flex:1"></div>
          <span class="badge">Score: <strong>${state.score}</strong> / ${state.questions.length}</span>
          <button class="btn ghost" id="btnReset">Reset</button>
        </div>
        ${state.tab==='quiz' ? quizView(q) : browseView()}
      </section>
    `;
    // events
    document.getElementById('tab-quiz').onclick = ()=>{state.tab='quiz'; renderObgyn();};
    document.getElementById('tab-browse').onclick = ()=>{state.tab='browse'; renderObgyn();};
    document.getElementById('btnReset').onclick = ()=>{
      state.current=0; state.score=0; state.answered=false; state.selectedIndex=null; state.filter=''; shuffle(state.questions); renderObgyn();
    };
    if (state.tab==='quiz') {
      for (const b of document.querySelectorAll('.opt')) b.onclick = onChoose;
      document.getElementById('btnNext').onclick = nextQuestion;
      document.getElementById('btnReveal').onclick = ()=>{ state.answered = true; renderObgyn(); };
    }
    if (state.tab==='browse') {
      document.getElementById('search').oninput = e => { state.filter = e.target.value; renderObgyn(); };
      for (const t of document.querySelectorAll('.toggle')) t.onclick = () => {
        const id = t.getAttribute('data-id');
        const ans = document.getElementById('ans-'+id);
        ans.hidden = !ans.hidden;
      };
    }
  }

  function quizView(q){
    const options = q.options.map((opt, i) => {
      let cls = 'opt';
      if (state.answered) {
        if (i === q.answer) cls += ' correct';
        else if (i === state.selectedIndex) cls += ' wrong';
      }
      return `<button class="${cls}" data-index="${i}">${String.fromCharCode(65+i)}. ${opt}</button>`;
    }).join('');
    return `
      <div class="q-item">
        <div class="q-stem">${q.question}</div>
        <div class="options">${options}</div>
        <div class="toolbar" style="margin-top:12px">
          <button class="btn secondary" id="btnReveal">Reveal</button>
          <button class="btn" id="btnNext">Next ▶</button>
          <span style="flex:1"></span>
          <span class="badge">${state.current+1} / ${state.questions.length}</span>
        </div>
        ${state.answered ? `<div class="answer"><strong>Answer:</strong> ${String.fromCharCode(65+q.answer)} — ${q.options[q.answer]}${q.explanation?`<br><em>${q.explanation}</em>`:''}</div>` : ''}
      </div>
    `;
  }

  function browseView(){
    const filtered = state.questions.filter(q => {
      const terms = state.filter.toLowerCase().split(/\s+/).filter(Boolean);
      return terms.every(t => (q.question+q.options.join(' ')+(q.explanation||'')).toLowerCase().includes(t));
    });
    const items = filtered.map(q => `
      <div class="card">
        <div class="q-stem">${q.question}</div>
        <div class="hr"></div>
        <div class="grid">
          ${q.options.map((o,i)=>`<div class="badge">${String.fromCharCode(65+i)}. ${o}</div>`).join('')}
        </div>
        <button class="btn ghost toggle" data-id="${q.id}" style="margin-top:10px">Show answer</button>
        <div class="answer" id="ans-${q.id}" hidden><strong>Answer:</strong> ${String.fromCharCode(65+q.answer)} — ${q.options[q.answer]}${q.explanation?`<br><em>${q.explanation}</em>`:''}</div>
      </div>
    `).join('');
    return `
      <div class="toolbar">
        <input class="input" id="search" placeholder="Search…" value="${state.filter}">
        <span class="badge">${filtered.length} shown</span>
      </div>
      <div class="grid">${items}</div>
    `;
  }

  function onChoose(e){
    if (state.answered) return;
    const idx = Number(e.currentTarget.getAttribute('data-index'));
    state.selectedIndex = idx;
    state.answered = true;
    if (idx === state.questions[state.current].answer) state.score += 1;
    renderObgyn();
  }
  function nextQuestion(){
    state.current = (state.current + 1) % state.questions.length;
    state.answered = false;
    state.selectedIndex = null;
    renderObgyn();
  }
  function shuffle(arr){
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]];
    }
  }

  // boot
  const y = document.getElementById('year'); if (y) y.textContent = new Date().getFullYear();
  route();
  </script>
</body>
</html>
